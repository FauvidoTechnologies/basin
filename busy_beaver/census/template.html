<title>Busy Beaver Growth Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; each growth class is a row of (description | rate histogram | space-time diagrams), tape cells as the visual motif. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #121418; --ink-2: #4b505a; --ink-3: #737985;
  --rule: #dde0e6; --grid: #eceef2; --cell: #1a1d23; --head: #eb6834;
  --c-bounded: #2a78d6; --c-log: #eb6834; --c-third: #1baf7a; --c-half: #eda100; --c-one: #e87ba4; --c-other: #8a8f98;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1114; --surface: #171a1f; --ink: #eceef2; --ink-2: #b3b8c2; --ink-3: #878d98;
  --rule: #2a2e36; --grid: #22262d; --cell: #e6e8ec; --head: #d95926;
  --c-bounded: #3987e5; --c-log: #d95926; --c-third: #199e70; --c-half: #c98500; --c-one: #d55181; --c-other: #7d838d;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #171a1f; --ink: #eceef2; --ink-2: #b3b8c2; --ink-3: #878d98;
  --rule: #2a2e36; --grid: #22262d; --cell: #e6e8ec; --head: #d95926;
  --c-bounded: #3987e5; --c-log: #d95926; --c-third: #199e70; --c-half: #c98500; --c-one: #d55181; --c-other: #7d838d;
  color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.08; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
.muted { color: var(--ink-2); }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
header { display: grid; gap: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px 36px; margin-top: 6px; }
.stat { display: grid; gap: 2px; }
.stat b { font: 600 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-2); }

/* the map: stacked shares */
.map { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; }
.bars { display: grid; gap: 14px; }
.barrow { display: grid; grid-template-columns: 190px 1fr; gap: 8px 16px; align-items: center; }
.barrow .lbl { font-size: 13px; color: var(--ink-2); }
.barrow .lbl b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.barrow.sub .lbl { padding-left: 14px; border-left: 2px solid var(--rule); }
.barrow.sub .lbl b { font-weight: 500; font-size: 13px; }
.barrow.sub .bar { height: 14px; }
.across { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.across b { color: var(--ink-2); font-weight: 500; }
.hist .mk { stroke: var(--ink); stroke-width: 1.5; }
.hist .mkl { fill: var(--ink); font: 500 10.5px var(--f-body); }
.ex.champ canvas { border-color: var(--ink); border-width: 2px; }
.ex .tag { font: 600 11px var(--f-body); color: var(--ink); letter-spacing: 0.02em; }
.bar { display: flex; gap: 2px; height: 22px; min-width: 0; }
.seg { height: 100%; border-radius: 0; min-width: 2px; cursor: default; position: relative; }
.seg:first-child { border-radius: 4px 0 0 4px; } .seg:last-child { border-radius: 0 4px 4px 0; }
.seg:only-child { border-radius: 4px; }
.seg:hover, .seg:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 620px) { .barrow { grid-template-columns: 1fr; } }

/* class sections */
.cls { display: grid; gap: 16px; border-top: 1px solid var(--rule); padding-top: 28px; }
.cls-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.cls-head .sw { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
.cls-head .share { font: 500 14px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cls-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .cls-body { grid-template-columns: minmax(0, 1fr); } }
.cls-text { display: grid; gap: 12px; }
.forms { display: grid; gap: 4px; font-size: 13px; }
.forms div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--grid); padding-block: 3px; }
.forms code { color: var(--ink); overflow-wrap: anywhere; }
.forms span { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 6px; }
.hist .t { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.hist svg { display: block; width: 100%; height: auto; overflow: visible; }
.hist text { fill: var(--ink-3); font: 10.5px var(--f-mono); }
.hist .gl { stroke: var(--grid); stroke-width: 1; }
.hist .ax { stroke: var(--rule); stroke-width: 1; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.ex { display: grid; gap: 6px; min-width: 0; }
.ex canvas { width: 100%; aspect-ratio: 1 / 1.25; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; image-rendering: pixelated; display: block; }
.ex .m { font: 10.5px/1.35 var(--f-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.ex .law { font: 500 11.5px/1.35 var(--f-mono); color: var(--ink); overflow-wrap: anywhere; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 6px; max-width: 260px; z-index: 20; }
.notes { display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.notes h2 { color: var(--ink); }
.notes li { margin-bottom: 6px; max-width: 75ch; }
.notes ul { margin: 0; padding-left: 20px; }
table.t { border-collapse: collapse; font-size: 13px; width: 100%; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--grid); }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--ink-3); font-weight: 500; }
.tablewrap { overflow-x: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
details summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">bbchallenge seed database · 5-state, 2-symbol machines</div>
    <h1>How non-halting Turing machines grow</h1>
    <p class="muted" id="lede"></p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="map" aria-labelledby="map-h">
    <h2 id="map-h">Share of machines in each growth class</h2>
    <div class="bars" id="bars"></div>
    <div class="legend" id="legend"></div>
    <details>
      <summary>Show as a table</summary>
      <div class="tablewrap"><table class="t" id="maptable"></table></div>
    </details>
  </section>

  <div id="classes" style="display:grid;gap:40px"></div>

  <section class="notes">
    <h2>How this was made</h2>
    <ul id="method"></ul>
  </section>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const DATA = /*DATA*/null;
const $ = (s, el = document) => el.querySelector(s);
const fmt = n => n.toLocaleString("en-US");
const pct = (a, b) => (100 * a / b).toFixed(a / b < 0.01 ? 2 : 1) + "%";
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// --- header
$("#lede").innerHTML = DATA.lede;
$("#stats").innerHTML = DATA.stats.map(s => `<div class="stat"><b>${s.v}</b><span>${s.k}</span></div>`).join("");

// --- the map
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) {
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }
const bars = $("#bars");
for (const g of DATA.groups) {
  const row = document.createElement("div"); row.className = "barrow" + (g.sub ? " sub" : "");
  row.innerHTML = `<div class="lbl"><b>${g.label}</b>${fmt(g.n)} sampled · ${g.note}</div><div class="bar" role="img" aria-label="${g.label}: ${DATA.classes.map(c => `${c.name} ${pct(g.counts[c.key] || 0, g.n)}`).join(", ")}"></div>`;
  const bar = $(".bar", row);
  for (const c of DATA.classes) {
    const k = g.counts[c.key] || 0; if (!k) continue;
    const s = document.createElement("div"); s.className = "seg"; s.tabIndex = 0;
    s.style.flex = `${k} 1 0`; s.style.background = `var(${c.color})`;
    const html = `<b>${c.name}</b><br>${fmt(k)} of ${fmt(g.n)} (${pct(k, g.n)})`;
    s.addEventListener("pointerenter", e => showTip(e, html)); s.addEventListener("pointermove", moveTip);
    s.addEventListener("pointerleave", hideTip);
    s.addEventListener("focus", () => { const r = s.getBoundingClientRect(); showTip({ clientX: r.left + r.width / 2, clientY: r.bottom }, html); });
    s.addEventListener("blur", hideTip);
    bar.appendChild(s);
  }
  bars.appendChild(row);
}
const all = DATA.groups.find(g => g.label === "5 states");
$("#legend").innerHTML = DATA.classes.map(c => `<span><i style="background:var(${c.color})"></i>${c.name} <b>${pct(all.counts[c.key] || 0, all.n)}</b></span>`).join("");
$("#maptable").innerHTML = `<tr><th>Growth class</th>${DATA.groups.map(g => `<th>${g.label}</th>`).join("")}</tr>` +
  DATA.classes.map(c => `<tr><td>${c.name}</td>${DATA.groups.map(g => `<td>${fmt(g.counts[c.key] || 0)} (${pct(g.counts[c.key] || 0, g.n)})</td>`).join("")}</tr>`).join("");

// --- histogram (single series, so no legend: the caption names it)
function histogram(h, color) {
  const W = 420, H = 150, L = 34, R = 8, T = 8, B = 24, iw = W - L - R, ih = H - T - B;
  const max = Math.max(...h.counts); const step = niceStep(max / 3);
  const top = Math.ceil(max / step) * step;
  const n = h.counts.length, bw = iw / n, barW = Math.min(24, Math.max(1, bw - 2));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h.title}">`;
  for (let v = 0; v <= top; v += step) {
    const y = T + ih - ih * v / top;
    s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end">${v >= 10000 ? (v / 1000) + "K" : fmt(v)}</text>`;
  }
  h.counts.forEach((c, i) => {
    if (!c) return;
    const x = L + i * bw + (bw - barW) / 2, hh = Math.max(1.5, ih * c / top), y = T + ih - hh, r = Math.min(2, barW / 2, hh);
    const tipHtml = `${h.binLabels[i]}<br><b>${fmt(c)}</b> machines`;
    s += `<path d="M${x},${T + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + barW - r} Q${x + barW},${y} ${x + barW},${y + r} V${T + ih} Z" fill="var(${color})" data-tip="${tipHtml}"/>`;
    s += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-tip="${tipHtml}"/>`;
  });
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/>`;
  if (h.marker) {
    const mx = L + h.marker.i * bw, right = mx > L + iw * 0.6;
    s += `<line class="mk" x1="${mx}" x2="${mx}" y1="${T + 4}" y2="${T + ih}"/><text class="mkl" x="${mx + (right ? -5 : 5)}" y="${T + 12}" text-anchor="${right ? "end" : "start"}">${h.marker.label}</text>`;
  }
  for (const [i, lab] of h.ticks) s += `<text x="${L + (i + 0.5) * bw}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  return s + "</svg>";
}
function niceStep(x) { const p = 10 ** Math.floor(Math.log10(Math.max(x, 1))); for (const m of [1, 2, 5, 10]) if (m * p >= x) return m * p; return 10 * p; }

// --- Turing machine simulation for space-time diagrams
function parseTM(s) {
  return s.split("_").map(part => [0, 1].map(r => {
    const t = part.slice(3 * r, 3 * r + 3);
    return t[2] === "-" ? null : { w: +t[0], m: t[1] === "R" ? 1 : -1, g: t.charCodeAt(2) - 65 };
  }));
}
function drawSpacetime(cv, machine, steps) {
  const tm = parseTM(machine);
  // pass 1: find the visited range
  let N = steps + 4, tape = new Uint8Array(2 * N + 1), pos = N, st = 0, lo = pos, hi = pos;
  for (let t = 0; t < steps; t++) {
    const tr = tm[st][tape[pos]]; if (!tr) break;
    tape[pos] = tr.w; pos += tr.m; st = tr.g; if (pos < lo) lo = pos; if (pos > hi) hi = pos;
  }
  const span = hi - lo + 1;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const Wp = Math.round(cv.clientWidth * dpr) || 300, Hp = Math.round(Wp * 1.25);
  cv.width = Wp; cv.height = Hp;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(Wp, Hp);
  const parse = c => { const d = document.createElement("canvas").getContext("2d"); d.fillStyle = c; d.fillRect(0, 0, 1, 1); return d.getImageData(0, 0, 1, 1).data; };
  const on = parse(css("--cell")), off = parse(css("--surface")), hd = parse(css("--head"));
  const pad = Math.max(2, Math.round(span * 0.04)), x0 = lo - pad, width = span + 2 * pad;
  const cellsPerPx = width / Wp;
  // pass 2: draw one row per sampled step
  tape.fill(0); pos = N; st = 0;
  const rowAt = r => Math.floor((r + 1) * steps / Hp);
  let row = 0, next = rowAt(0);
  for (let t = 0; t <= steps && row < Hp; t++) {
    while (t >= next && row < Hp) {
      const headX = (pos - x0 + 0.5) / cellsPerPx;
      for (let x = 0; x < Wp; x++) {
        const c0 = x0 + Math.floor(x * cellsPerPx), c1 = Math.max(c0 + 1, x0 + Math.floor((x + 1) * cellsPerPx));
        let ones = 0; for (let c = c0; c < c1; c++) if (c >= 0 && c < tape.length && tape[c]) ones++;
        const f = ones / (c1 - c0), k = 4 * (row * Wp + x);
        if (Math.abs(x + 0.5 - headX) <= Math.max(1, 0.5 / cellsPerPx * 0.25)) {
          img.data[k] = hd[0]; img.data[k + 1] = hd[1]; img.data[k + 2] = hd[2];
        } else {
          for (let j = 0; j < 3; j++) img.data[k + j] = off[j] + (on[j] - off[j]) * f;
        }
        img.data[k + 3] = 255;
      }
      row++; next = rowAt(row);
    }
    if (t === steps) break;
    const tr = tm[st][tape[pos]]; if (!tr) break;
    tape[pos] = tr.w; pos += tr.m; st = tr.g;
  }
  ctx.putImageData(img, 0, 0);
}

// --- class sections
const host = $("#classes"), toDraw = [];
for (const c of DATA.classes) {
  const n = all.counts[c.key] || 0;
  const sec = document.createElement("section"); sec.className = "cls"; sec.id = "class-" + c.key;
  sec.innerHTML = `
    <div class="cls-head"><span class="sw" style="background:var(${c.color})"></span><h2>${c.name}</h2>
      <span class="share">${fmt(n)} of ${fmt(all.n)} sampled 5-state machines</span></div>
    <div class="across">${c.across.map(a => `<span>${a.n} states <b>${a.v < 0.05 && a.v > 0 ? a.v.toFixed(2) : a.v.toFixed(1)}%</b></span>`).join("")}</div>
    <div class="cls-body">
      <div class="cls-text">
        <p>${c.text}</p>
        ${c.forms.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Most common law shapes from basin</div>
          <div class="forms">${c.forms.map(([f, k]) => `<div><code>${f}</code><span>${fmt(k)}</span></div>`).join("")}</div></div>` : ""}
      </div>
      ${c.hist ? `<div class="hist"><div class="t">${c.hist.title}</div>${histogram(c.hist, c.color)}</div>` : ""}
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:8px">Examples · space-time diagrams, time runs down, first ${fmt(c.steps)} steps</div>
      <div class="gallery">${c.examples.map((e, j) => `<figure class="ex" style="margin:0">
        <canvas data-m="${e.machine}" data-steps="${c.steps}" aria-label="Space-time diagram of ${e.machine}"></canvas>
        <figcaption><div class="law">${e.law}</div><div class="m">${e.machine}</div></figcaption></figure>`).join("")}</div>
    </div>`;
  host.appendChild(sec);
}
document.addEventListener("pointerover", e => { const el = e.target.closest("[data-tip]"); if (el) showTip(e, el.dataset.tip); });
document.addEventListener("pointermove", e => { if (!tip.hidden && e.target.closest("[data-tip]")) moveTip(e); });
document.addEventListener("pointerout", e => { if (e.target.closest("[data-tip]")) hideTip(); });

{
  const sec = document.createElement("section"); sec.className = "cls"; sec.id = "roughest";
  sec.innerHTML = `<div class="cls-head"><span class="sw" style="background:var(--c-half)"></span><h2>The roughest √t machines, next to the BB(5) champion</h2></div>
    <p>${DATA.rough.text}</p>
    <div><div class="eyebrow" style="margin-bottom:8px">Space-time diagrams, first ${fmt(DATA.rough.steps)} steps</div>
    <div class="gallery">${DATA.rough.examples.map(e => `<figure class="ex${e.champ ? " champ" : ""}" style="margin:0">
      <canvas data-m="${e.machine}" data-steps="${DATA.rough.steps}" aria-label="Space-time diagram of ${e.machine}"></canvas>
      <figcaption>${e.champ ? `<div class="tag">BB(5) champion (halts)</div>` : ""}<div class="law">${e.law}</div><div class="m">${e.machine}</div></figcaption></figure>`).join("")}</div></div>`;
  host.appendChild(sec);
}
$("#method").innerHTML = DATA.method.map(m => `<li>${m}</li>`).join("");

function drawAll() { document.querySelectorAll("canvas[data-m]").forEach(cv => drawSpacetime(cv, cv.dataset.m, +cv.dataset.steps)); }
drawAll();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 200); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);
new MutationObserver(drawAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
