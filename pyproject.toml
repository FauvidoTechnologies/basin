[tool.poetry]
name = "basin-sr"
version = "0.1.1"
description = "Law finder for tables of measurements: BACON proposes terms, sparse regression and cross-validation decide"
authors = ["pUrGe12 <achintya.jai@owasp.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/FauvidoTechnologies/basin"
repository = "https://github.com/FauvidoTechnologies/basin"
keywords = ["symbolic-regression", "equation-discovery", "BACON", "SINDy", "scientific-discovery"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
packages = [{include = "basin"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.24"
scipy = ">=1.10"
sympy = ">=1.12"
pysindy = ">=2.0,<3.0"
scikit-learn = ">=1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.ruff]
line-length = 99

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
